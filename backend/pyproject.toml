[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leaseguard-backend"
version = "0.1.0"
description = "LeaseGuard AI modular monolith"
requires-python = ">=3.12"
dependencies = ["prometheus-client>=0.21,<1", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0,<3", "alembic>=1.15,<2", "asyncpg>=0.30,<1", "redis>=5.2,<7", "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "email-validator>=2.2,<3", "python-multipart>=0.0.22,<1", "boto3>=1.37,<2", "defusedxml>=0.7,<1", "pypdf>=6.0,<7", "qdrant-client>=1.15,<2", "httpx>=0.28,<1", "neo4j>=5.28,<7", "jsonschema>=4.23,<5", "langgraph>=1.2,<2", "langsmith>=0.4,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "aiosqlite>=0.21,<1", "types-defusedxml>=0.7", "types-jsonschema>=4.23", "boto3-stubs[s3]>=1.37,<2", "reportlab>=4.3,<5", "pillow>=11,<13"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
