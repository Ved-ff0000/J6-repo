name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leaseguard
          POSTGRES_PASSWORD: leaseguard
          POSTGRES_DB: leaseguard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leaseguard -d leaseguard"
          --health-interval 5s --health-timeout 3s --health-retries 10
      neo4j:
        image: neo4j:5.26.16-community
        env:
          NEO4J_AUTH: neo4j/leaseguard-ci-graph-only
          NEO4J_server_memory_heap_initial__size: 128m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports: ['7687:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p leaseguard-ci-graph-only 'RETURN 1'"
          --health-start-period 45s --health-interval 10s --health-timeout 10s --health-retries 12
      qdrant:
        image: qdrant/qdrant:v1.17.0
        ports: ['6333:6333']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LEASEGUARD_RUN_INTEGRATION: '1'
      # CI never pays for model calls. Provider contract tests use explicit mock HTTP.
      LEASEGUARD_LLM_ENABLED: 'false'
      LEASEGUARD_WORKFLOW_ENABLED: 'false'
      LEASEGUARD_LEASE_EXTRACTION_ENABLED: 'false'
      LEASEGUARD_CONFLICTS_ENABLED: 'false'
      LEASEGUARD_RULES_ENABLED: 'false'
      LEASEGUARD_RULES_DISABLED: '[]'
      LEASEGUARD_RUN_PROVIDER_LIVE: '0'
      LEASEGUARD_S3_ACCESS_KEY: leaseguard-ci
      LEASEGUARD_S3_SECRET_KEY: leaseguard-ci-storage-only
      LEASEGUARD_S3_ENDPOINT: http://localhost:9000
      LEASEGUARD_QDRANT_URL: http://localhost:6333
      LEASEGUARD_NEO4J_URI: bolt://localhost:7687
      LEASEGUARD_NEO4J_PASSWORD: leaseguard-ci-graph-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - name: Start private MinIO for integration tests
        run: docker run -d --name leaseguard-minio -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=leaseguard-ci -e MINIO_ROOT_PASSWORD=leaseguard-ci-storage-only minio/minio:latest server /data
      - run: python -m app.documents.init_storage
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - name: Empty-database migration roundtrip (never erase populated audit/history)
        env:
          PGPASSWORD: leaseguard
        run: |
          createdb -h localhost -U leaseguard leaseguard_roundtrip
          export LEASEGUARD_DATABASE_URL=postgresql+asyncpg://leaseguard:leaseguard@localhost:5432/leaseguard_roundtrip
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - run: python -m app.evaluation --gold ../evaluation/golden.json
